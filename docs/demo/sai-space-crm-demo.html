<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sai Space Realty CRM Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the real app's shell. Navy sidebar + light work area; bottom tabs on phones. Single light look, matching the product. */
:root {
  color-scheme: light;
  --navy: #0b1f3a; --navy-dark: #071527; --navy-soft: #102b50;
  --gold: #c08a25; --gold-dark: #9c6e17; --gold-light: #f0cb78; --gold-tint: #fbf1dd;
  --canvas: #fafafa; --panel: #ffffff; --line: #e7e7ec; --col: #f5f5f8;
  --ink: #1b1b23; --ink-dim: #6b6b76; --ink-faint: #9797a3;
  --ok: #0f7a44; --ok-bg: #dcf6e8; --warn: #a15c00; --warn-bg: #fdebcb; --bad: #b23434; --bad-bg: #fbe2e2;
  --online: #25c281; --idle: #f2a93b; --offline: #b5b5c0;
  --font: 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- demo ribbon ---------- */
.ribbon { position: fixed; z-index: 60; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 6px) 16px 6px; background: var(--gold); color: var(--navy-dark); font-size: 12px; font-weight: 600; text-align: center; }

/* ---------- login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding: 56px 16px 32px; background: linear-gradient(135deg, #081a33, #102b50 45%, #1c3a66 70%, #0d234a); position: relative; overflow: hidden; }
.login .city { position: absolute; inset: auto 0 0 0; height: 38%; pointer-events: none; }
.card-login { position: relative; z-index: 1; width: 100%; max-width: 420px; background: var(--panel); border-radius: 18px; padding: 28px; box-shadow: 0 25px 60px #00000055; }
.card-login img { display: block; margin: 0 auto; width: 132px; }
.card-login h1 { margin: 10px 0 2px; text-align: center; font-size: 20px; color: var(--navy); }
.card-login p.sub { margin: 0 0 18px; text-align: center; color: var(--ink-dim); font-size: 13px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-dim); }
.input, select.input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px var(--gold-tint); }
.roles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.role-opt { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.role-opt b { font-size: 13px; }
.role-opt span { font-size: 11px; color: var(--ink-dim); }
.role-opt[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-tint); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-faint); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn.gold:hover { background: var(--gold-dark); }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.block { width: 100%; height: 42px; }
.otp { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
.otp span { width: 40px; height: 48px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; font-size: 20px; font-weight: 700; color: var(--navy); background: var(--col); }
.note { font-size: 12px; color: var(--ink-dim); text-align: center; margin-top: 14px; }
.qr { width: 132px; height: 132px; margin: 4px auto 0; display: block; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; padding-top: 30px; }
.side { position: sticky; top: 30px; height: calc(100vh - 30px); background: var(--navy); color: #cfd8e6; display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; color: #fff; }
.brand img { width: 38px; height: 38px; border-radius: 9px; background: #fff; }
.brand b { display: block; font-size: 14px; }
.brand small { color: var(--gold-light); font-size: 11px; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; background: none; color: inherit; text-align: left; font-size: 13.5px; }
.nav button:hover { background: var(--navy-soft); color: #fff; }
.nav button[aria-current="page"] { background: var(--gold); color: var(--navy-dark); font-weight: 600; }
.nav svg { width: 18px; height: 18px; flex: none; }
.side .me { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #ffffff1a; font-size: 12px; }
.side .me b { color: #fff; display: block; font-size: 13px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 30px; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: #ffffffe8; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top h2 { margin: 0; font-size: 18px; color: var(--navy); flex: 1; min-width: 0; }
.top .viewas { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); }
.top .viewas select { height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 0 8px; font-size: 12.5px; }
.bell { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.bell i { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #d64545; color: #fff; font-size: 10.5px; font-style: normal; font-weight: 700; display: grid; place-items: center; }
.content { padding: 24px; display: grid; gap: 20px; align-content: start; }

.mtabs { display: none; }

/* ---------- building blocks ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel > header h3 { margin: 0; font-size: 14px; flex: 1; }
.panel .body { padding: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 16px; display: grid; gap: 4px; }
.kpi small { color: var(--ink-dim); font-size: 12px; font-weight: 500; }
.kpi b { font-size: 24px; color: var(--navy); letter-spacing: -0.01em; }
.kpi em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--ok); }
.kpi em.down { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--col); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: #fcfaf5; }
.who { display: flex; align-items: center; gap: 10px; }
.av { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--navy); background: var(--gold-tint); }
.av.navy { background: var(--navy); color: var(--gold-light); }
.dim { color: var(--ink-dim); }
.faint { color: var(--ink-faint); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.ok { background: var(--ok-bg); color: var(--ok); }
.warn { background: var(--warn-bg); color: var(--warn); }
.bad { background: var(--bad-bg); color: var(--bad); }
.neutral { background: var(--col); color: var(--ink-dim); }
.goldp { background: var(--gold-tint); color: var(--gold-dark); }
.lock { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-dim); }
.lock svg { width: 12px; height: 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .input { width: auto; flex: 1 1 220px; height: 36px; }
.toolbar select.input { flex: 0 1 180px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 0 12px; height: 34px; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.bar { height: 8px; border-radius: 4px; background: var(--col); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.bar.ok i { background: var(--ok); }
.empty { padding: 28px; text-align: center; color: var(--ink-dim); }
.scopehint { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--gold-tint); color: var(--gold-dark); font-size: 12.5px; font-weight: 500; }
.scopehint svg { width: 16px; height: 16px; flex: none; }

/* pipeline */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.kcol { background: var(--col); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.kcol h4 { margin: 0 0 2px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.kcol h4 span { margin-left: auto; color: var(--ink-faint); font-weight: 600; }
.kcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; text-align: left; width: 100%; }
.kcard:hover { border-color: var(--gold); }
.kcard b { font-size: 13px; }

/* drawer */
.scrim { position: fixed; inset: 0; z-index: 70; background: #07152766; display: flex; justify-content: flex-end; }
.drawer { width: min(460px, 100%); height: 100%; background: var(--panel); overflow-y: auto; box-shadow: -20px 0 50px #0003; display: flex; flex-direction: column; animation: slide .2s ease-out; }
@keyframes slide { from { transform: translateX(30px); opacity: .6; } }
.drawer > header { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.drawer > header h3 { margin: 0; font-size: 18px; color: var(--navy); }
.drawer section { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.drawer section h4 { margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--ink-dim); }
.kv dd { margin: 0; font-weight: 500; }
.timeline { display: grid; gap: 12px; }
.tl { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; font-size: 13px; }
.tl i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); margin-top: 5px; }
.x { border: 0; background: var(--col); width: 32px; height: 32px; border-radius: 8px; margin-left: auto; flex: none; }
.modal { margin: auto; width: min(480px, calc(100% - 32px)); background: var(--panel); border-radius: 16px; padding: 20px; box-shadow: 0 25px 60px #0004; }
.scrim.center { justify-content: center; align-items: center; }
.modal h3 { margin: 0 0 14px; color: var(--navy); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* projects */
.proj { overflow: hidden; display: grid; }
.proj .hero { height: 96px; background: linear-gradient(135deg, var(--navy), var(--navy-soft)); position: relative; }
.proj .hero svg { position: absolute; inset: auto 0 0 0; width: 100%; height: 70px; }
.proj .body { display: grid; gap: 10px; }
.proj h3 { margin: 0; font-size: 16px; color: var(--navy); }
.units { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.unit { height: 44px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
.unit.available { background: var(--ok-bg); color: var(--ok); }
.unit.hold { background: var(--warn-bg); color: var(--warn); }
.unit.booked { background: var(--navy); color: var(--gold-light); }
.unit.blocked { background: var(--col); color: var(--ink-faint); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }
.floorlbl { font-size: 11px; color: var(--ink-faint); display: grid; place-items: center; }
.tower { display: grid; grid-template-columns: 34px repeat(4, minmax(0, 1fr)); gap: 6px; }

/* map */
.map { position: relative; height: 460px; border-radius: 14px; overflow: hidden; background: #e9eef3; }
.map svg { width: 100%; height: 100%; display: block; }
.pin { cursor: pointer; }
.maplist { display: grid; gap: 2px; }
.maplist button { display: flex; gap: 10px; align-items: center; padding: 10px; border: 0; background: none; border-radius: 10px; text-align: left; width: 100%; }
.maplist button:hover, .maplist button[aria-pressed="true"] { background: var(--col); }
.status-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* tasks */
.tcard { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); text-align: left; width: 100%; }
.tcard .chk { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--ink-faint); display: grid; place-items: center; margin-top: 1px; }
.tcard.done .chk { background: var(--ok); border-color: var(--ok); color: #fff; }
.tcard.done b { text-decoration: line-through; color: var(--ink-faint); }

/* chart */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-dim); font-size: 11px; font-family: var(--font); }

.toast { position: fixed; z-index: 90; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px #0004; }

.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.yes { color: var(--ok); font-weight: 700; }
.no { color: var(--ink-faint); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .top { padding: 10px 16px; flex-wrap: wrap; }
  .top .viewas span { display: none; }
  .content { padding: 16px 16px 96px; }
  .grid3 { grid-template-columns: minmax(0, 1fr); }
  .kpi b { font-size: 20px; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .map { height: 340px; }
  .mtabs { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; padding: 6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px); background: var(--navy); }
  .mtabs button { display: grid; justify-items: center; gap: 2px; border: 0; background: none; color: #b9c4d6; font-size: 10.5px; padding: 4px 0; }
  .mtabs button[aria-current="page"] { color: var(--gold-light); }
  .mtabs svg { width: 20px; height: 20px; }
  .roles { grid-template-columns: minmax(0, 1fr); }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); max-width: calc(100% - 32px); }
}
</style>

<div class="ribbon" role="note">Demo with sample data. Nothing you do here is saved or sent anywhere.</div>

function leads() {
  const L = visibleLeads().filter((l) => (!S.q || (l.name + l.source + l.id).toLowerCase().includes(S.q.toLowerCase())) && (!S.stageF || l.stage === S.stageF));
  const list = `<div class="panel"><div class="tablewrap"><table>
    <thead><tr><th>Lead</th><th>Phone</th><th>Stage</th><th>Project</th><th>Budget</th><th>Source</th><th>Owner</th><th>Next follow-up</th></tr></thead>
    <tbody>${L.map((l) => `<tr class="click" data-lead="${l.id}">
      <td><div class="who"><span class="av">${initials(l.name)}</span><div><b>${esc(l.name)}</b><div class="faint">${l.id}</div></div></div></td>
      <td class="num">${maskPhone(l.phone)}</td>
      <td>${stagePill(l.stage)}</td>
      <td>${esc(PROJECTS.find((p) => p.id === l.project).name)}</td>
      <td class="num">${l.bmin && l.bmax ? inr(l.bmin) + ' – ' + inr(l.bmax) : l.bmax ? 'up to ' + inr(l.bmax) : inr(l.bmin) + '+'}</td>
      <td>${esc(l.source)}</td>
      <td>${esc(person(l.owner).name.split(' ')[0])}</td>
      <td class="num ${['booked', 'lost'].includes(l.stage) ? 'faint' : l.follow < Date.now() ? '' : 'dim'}" ${!['booked', 'lost'].includes(l.stage) && l.follow < Date.now() ? 'style="color:var(--bad);font-weight:600"' : ''}>${['booked', 'lost'].includes(l.stage) ? '—' : fDay(l.follow) + ', ' + fTime(l.follow)}</td>
    </tr>`).join('') || `<tr><td colspan="8"><div class="empty">No leads match. Clear the search or the stage filter.</div></td></tr>`}</tbody></table></div></div>`;
  const board = `<div class="kanban">${STAGES.map((s) => { const items = L.filter((l) => l.stage === s.key); return `<div class="kcol"><h4><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.label}<span>${items.length}</span></h4>${items.map((l) => `<button class="kcard" data-lead="${l.id}"><b>${esc(l.name)}</b><span class="faint">${esc(PROJECTS.find((p) => p.id === l.project).name)} · ${l.cfg}</span><span class="faint">${esc(person(l.owner).name.split(' ')[0])} · ${esc(l.source)}</span></button>`).join('')}</div>`; }).join('')}</div>`;
  return shell(`
    ${scopeHint()}
    <div class="toolbar">
      <input class="input" id="q" placeholder="Search name, source or lead ID" value="${esc(S.q)}" aria-label="Search leads">
      <select class="input" id="stageF" aria-label="Filter by stage"><option value="">All stages</option>${STAGES.map((s) => `<option value="${s.key}" ${S.stageF === s.key ? 'selected' : ''}>${s.label}</option>`).join('')}</select>
      <div class="seg" role="group" aria-label="View"><button data-lv="list" aria-pressed="${S.leadView === 'list'}">List</button><button data-lv="board" aria-pressed="${S.leadView === 'board'}">Pipeline</button></div>
      <button class="btn" data-act="import">Import Excel</button>
      <button class="btn gold" data-act="addLead">${ic('plus', 'width="16" height="16"')}Add lead</button>
    </div>
    ${S.leadView === 'list' ? list : board}
    <p class="faint">${ic('lock', 'width="12" height="12" style="vertical-align:-1px"')} Phone numbers are stored encrypted and shown masked in lists. Opening a lead reveals the number and writes an audit-log entry.</p>`);
}

function tasks() {
  const T = TASKS.filter((t) => R().scope !== 'own' || t.who === R().user);
  const col = (title, arr) => `<section class="panel"><header><h3>${title}</h3><span class="faint num">${arr.length}</span></header><div class="body" style="display:grid;gap:8px">${arr.map((t) => `<button class="tcard ${t.done ? 'done' : ''}" data-task="${t.id}" aria-pressed="${t.done}"><span class="chk">${t.done ? ic('check', 'width="14" height="14"') : ''}</span><span style="display:grid;gap:3px"><b>${esc(t.title)}</b><span class="faint">${esc(person(t.who).name.split(' ')[0])} · ${fDay(t.due)} ${fTime(t.due)} ${t.prio === 'high' ? '· <span style="color:var(--bad);font-weight:600">High</span>' : ''}</span></span></button>`).join('') || '<div class="empty">Nothing here.</div>'}</div></section>`;
  const open = T.filter((t) => !t.done), overdue = open.filter((t) => t.due < Date.now()), rest = open.filter((t) => t.due >= Date.now());
  return shell(`${scopeHint()}<div class="grid3">${col('Overdue', overdue)}${col('Upcoming', rest)}${col('Done', T.filter((t) => t.done))}</div><p class="faint">Tap a task to mark it done. Managers assign tasks and the assignee gets a live notification.</p>`);
}

function incentives() {
  const I = INCENTIVES.filter((i) => R().scope !== 'own' || i.who === R().user);
  return shell(`${scopeHint()}<div class="panel"><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Bookings</th><th>Booking value</th><th>Earned</th><th>Paid</th><th>Pending</th></tr></thead>
    <tbody>${I.map((i) => `<tr><td><div class="who"><span class="av">${initials(person(i.who).name)}</span><div><b>${esc(person(i.who).name)}</b>${i.note ? `<div class="faint">${i.note}</div>` : ''}</div></div></td><td class="num">${i.bookings}</td><td class="num">${inr(i.value)}</td><td class="num">${inr(i.earned)}</td><td class="num">${inr(i.paid)}</td><td>${i.earned - i.paid > 0 ? `<span class="pill warn num">${inr(i.earned - i.paid)}</span>` : '<span class="pill ok">Settled</span>'}</td></tr>`).join('') || '<tr><td colspan="6"><div class="empty">No incentives yet.</div></td></tr>'}</tbody></table></div></div>
    <p class="faint">Rules from Settings: 1% of agreement value for the closing executive, 0.25% for their manager, ₹2,000 per visit that converts for telecallers. Calculated automatically when a booking is made.</p>`);
}

function reports() {
  const W = 560, H = 220, pad = 34, bw = 30;
  const maxL = 80;
  const x = (i) => pad + 10 + i * ((W - pad - 20) / MONTHS.length);
  const y = (v) => H - 26 - (v / maxL) * (H - 50);
  const yb = (v) => H - 26 - (v / 6) * (H - 50);
  return shell(`<div class="kpis">
      <div class="panel kpi"><small>Leads this quarter</small><b class="num">156</b><em>+18% vs last</em></div>
      <div class="panel kpi"><small>Lead → visit</small><b class="num">31%</b><em>+4 pts</em></div>
      <div class="panel kpi"><small>Visit → booking</small><b class="num">19%</b><em class="down">−2 pts</em></div>
      <div class="panel kpi"><small>Avg. days to close</small><b class="num">34</b><em>−5 days</em></div>
    </div>
    <div class="grid2">
      <section class="panel"><header><h3>Leads and bookings by month</h3><span class="faint"><span style="display:inline-block;width:10px;height:10px;background:var(--navy);border-radius:2px"></span> leads &nbsp;<span style="display:inline-block;width:10px;height:10px;background:var(--gold);border-radius:2px"></span> bookings</span></header><div class="body">
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Leads and bookings by month">
          ${[0, 20, 40, 60, 80].map((v) => `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e7e7ec"/><text x="${pad - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
          ${MONTHS.map(([m, b, l], i) => `<rect x="${x(i)}" y="${y(l)}" width="${bw}" height="${H - 26 - y(l)}" rx="4" fill="#0b1f3a"/><rect x="${x(i) + bw + 4}" y="${yb(b)}" width="${bw - 10}" height="${H - 26 - yb(b)}" rx="4" fill="#c08a25"/><text x="${x(i) + bw / 2 + 8}" y="${H - 8}" text-anchor="middle">${m}</text><text x="${x(i) + bw / 2}" y="${y(l) - 5}" text-anchor="middle" style="fill:#1b1b23;font-weight:600">${l}</text><text x="${x(i) + bw + 14}" y="${yb(b) - 5}" text-anchor="middle" style="fill:#9c6e17;font-weight:600">${b}</text>`).join('')}
        </svg>
        <p class="faint" style="margin:6px 0 0">Bookings use their own scale (0–6) so both series stay readable.</p></div></section>
      <section class="panel"><header><h3>Executive scorecard</h3></header><div class="tablewrap"><table><thead><tr><th>Executive</th><th>Leads</th><th>Visits</th><th>Bookings</th></tr></thead><tbody>
        ${[['bb', 6, 4, 2], ['rk', 5, 2, 2], ['sr', 5, 1, 0]].map(([w, l, v, b]) => `<tr><td>${esc(person(w).name)}</td><td class="num">${l}</td><td class="num">${v}</td><td class="num"><b>${b}</b></td></tr>`).join('')}
      </tbody></table></div></section>
    </div>
    <div class="toolbar"><button class="btn" data-act="export">Export to Excel</button><span class="faint">Every report can be filtered by date, project, source and executive.</span></div>`);
}

function settings() {
  const perms = [['Leads', 1, 1, 1, 1], ['Projects', 1, 1, 1, 0], ['Bookings', 1, 1, 1, 0], ['Live Tracking', 1, 1, 0, 0], ['Employees', 1, 0, 0, 0], ['Reports', 1, 1, 0, 0], ['Settings', 1, 0, 0, 0]];
  return shell(`<div class="grid2">
    <section class="panel"><header><h3>Company</h3></header><div class="body"><dl class="kv"><dt>Name</dt><dd>Sai Space Realty</dd><dt>Office</dt><dd>Baner, Pune 411045</dd><dt>Office geofence</dt><dd>150 m around the office pin</dd><dt>Work hours</dt><dd>9:30 am – 6:30 pm, Mon–Sat</dd><dt>GST</dt><dd class="num">27ABCDE1234F1Z5 (sample)</dd></dl></div></section>
    <section class="panel"><header><h3>Lead sources connected</h3></header><div class="body" style="display:grid;gap:8px">
      ${[['Website form', 'Webhook', 'ok'], ['Facebook & Instagram ads', 'via Zapier', 'ok'], ['Google Ads lead form', 'Webhook', 'ok'], ['99acres · MagicBricks · Housing.com', 'Excel import', 'goldp']].map(([n, h, c]) => `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span>${n}</span><span class="pill ${c}">${h}</span></div>`).join('')}
    </div></section></div>
    <section class="panel"><header><h3>Role permissions</h3><span class="faint">The Admin can also adjust these per person</span></header><div class="tablewrap"><table class="matrix"><thead><tr><th>Module</th><th>Owner</th><th>Manager</th><th>Sales</th><th>Telecaller</th></tr></thead>
      <tbody>${perms.map(([m, ...r]) => `<tr><td>${m}</td>${r.map((v) => `<td class="${v ? 'yes' : 'no'}">${v ? '✓' : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
    <section class="panel"><header><h3>Security</h3></header><div class="body" style="display:grid;gap:8px;font-size:13px">
      ${['Customer phones, KYC, amounts and GPS points encrypted with AES-256; the key lives in a vault, never in the app.', 'Every record-level rule is enforced inside the database, so a user cannot see another team’s data even with technical tools.', 'Owner and Admin sign in with password plus authenticator-app code.', 'Accounts lock for 15 minutes after repeated wrong passwords; idle sessions sign out after 8 hours.', 'Every view of sensitive data is written to a tamper-proof audit log.'].map((t) => `<div style="display:flex;gap:10px"><span style="color:var(--ok)">${ic('check', 'width="16" height="16"')}</span><span>${t}</span></div>`).join('')}
    </div></section>`);
}

const PAGES = { dashboard, leads, projects, visits, bookings, clients, tasks, attendance, tracking, employees, incentives, reports, settings };

/* ---------------- modals ---------------- */
function modalView() {
  if (S.modal === 'addLead') return `<div class="scrim center" data-close="1"><form class="modal" id="leadForm" role="dialog" aria-modal="true" aria-label="Add lead"><h3>Add lead</h3>
    <div class="row2"><div class="field"><label for="ln">Name</label><input class="input" id="ln" required value="Rakesh Shinde"></div><div class="field"><label for="lp">Mobile</label><input class="input" id="lp" required inputmode="numeric" value="9811100099"></div></div>
    <div class="row2"><div class="field"><label for="lpr">Project</label><select class="input" id="lpr">${PROJECTS.map((p) => `<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label for="ls">Source</label><select class="input" id="ls">${['Walk-in', 'Website', 'Facebook', 'Instagram', 'Referral', '99acres'].map((s) => `<option>${s}</option>`).join('')}</select></div></div>
    <div class="row2"><div class="field"><label for="lb">Budget up to</label><input class="input" id="lb" value="85 L"></div><div class="field"><label for="lc">Configuration</label><select class="input" id="lc"><option>1 BHK</option><option selected>2 BHK</option><option>3 BHK</option></select></div></div>
    <p class="faint" style="margin:0 0 14px">If this mobile number already exists, the CRM warns about the duplicate before saving.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-close="1">Cancel</button><button class="btn gold">Save lead</button></div></form></div>`;
  if (S.modal === 'import') return `<div class="scrim center" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Import leads"><h3>Import leads from Excel</h3>
    <p class="dim" style="margin-top:0">Upload the export from 99acres, MagicBricks or Housing.com. Columns are matched automatically and duplicates are skipped.</p>
    <div class="panel" style="padding:12px;display:grid;gap:6px;font-size:13px"><b>sample-99acres-export.xlsx</b><span class="faint">24 rows · 21 new · 3 duplicates skipped</span><div class="bar ok"><i style="width:100%"></i></div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" data-close="1">Close</button><button class="btn gold" data-act="importDone">Import 21 leads</button></div></div></div>`;
  if (S.modal === 'addEmp') return `<div class="scrim center" data-close="1"><form class="modal" id="empForm" role="dialog" aria-modal="true" aria-label="Add employee"><h3>Add employee</h3>
    <div class="row2"><div class="field"><label for="en">Full name</label><input class="input" id="en" value="Snehal Pawar"></div><div class="field"><label for="eu">Username</label><input class="input" id="eu" value="snehal"></div></div>
    <div class="row2"><div class="field"><label for="er">Role</label><select class="input" id="er"><option>Sales Executive</option><option>Telecaller</option><option>Sales Manager</option></select></div><div class="field"><label for="em">Reports to</label><select class="input" id="em"><option>Neha Kulkarni</option></select></div></div>
    <p class="faint" style="margin:0 0 14px">A temporary password is generated. They must set their own at first sign-in.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-close="1">Cancel</button><button class="btn gold">Create account</button></div></form></div>`;
  return '';
}

/* ---------------- render + events ---------------- */
function render() {
  if (S.screen !== 'app') { app.innerHTML = loginView(); return; }
  if (!R().mods.includes(S.page)) S.page = 'dashboard';
  let html = PAGES[S.page]();
  if (S.open) html += leadDrawer(LEADS.find((l) => l.id === S.open));
  html += modalView();
  app.innerHTML = html;
}

app.addEventListener('click', (e) => {
  const t = e.target.closest('button, tr[data-lead], g[data-pin], .scrim');
  if (!t) return;
  if (t.classList.contains('scrim')) { if (e.target === t) { S.open = null; S.modal = null; render(); } return; }
  const ds = t.dataset;
  if (ds.close) { S.open = null; S.modal = null; render(); return; }
  if (ds.role) { S.loginRole = ds.role; render(); return; }
  if (ds.go) return go(ds.go);
  if (ds.lv) { S.leadView = ds.lv; render(); return; }
  if (ds.proj) { S.project = ds.proj; S.tower = PROJECTS.find((p) => p.id === ds.proj).towers[0]; render(); return; }
  if (ds.tower) { S.tower = ds.tower; render(); return; }
  if (ds.pin) { S.pin = ds.pin; render(); return; }
  if (ds.task) { const k = TASKS.find((x) => x.id === +ds.task); k.done = !k.done; render(); toast(k.done ? 'Task marked done' : 'Task reopened'); return; }
  if (ds.act === 'visit') { S.open = null; render(); toast('Site visit scheduled for tomorrow, 11:00 am'); return; }
  if (ds.lead && !ds.act) { S.open = ds.lead; render(); return; }
  switch (ds.act) {
    case 'verify': S.screen = 'app'; S.page = 'dashboard'; render(); toast('Signed in as Owner'); break;
    case 'logout': S.screen = 'login'; S.open = null; render(); break;
    case 'notif': S.notif = !S.notif; render(); break;
    case 'addLead': case 'import': case 'addEmp': S.modal = ds.act; render(); break;
    case 'importDone': S.modal = null; render(); toast('21 leads imported, 3 duplicates skipped'); break;
    case 'checkin': S.checkedIn = !S.checkedIn; render(); toast(S.checkedIn ? 'Checked in · location recorded' : 'Checked out'); break;
    case 'call': toast('Call logged'); break;
    case 'export': toast('Report exported (demo)'); break;
  }
});
app.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'loginForm') {
    S.role = S.loginRole;
    if (S.role === 'owner') { S.screen = 'otp'; render(); return; }
    S.screen = 'app'; S.page = 'dashboard'; render(); toast('Signed in as ' + ROLES[S.role].label); return;
  }
  if (e.target.id === 'leadForm') {
    const v = (id) => document.getElementById(id).value.trim();
    const phone = v('lp').replace(/\D/g, '').slice(-10);
    if (LEADS.some((l) => l.phone === phone)) { toast('A lead with this mobile number already exists'); return; }
    const bud = parseFloat(v('lb')) * (/cr/i.test(v('lb')) ? 1e7 : 1e5);
    LEADS.unshift({ id: 'L' + (101 + LEADS.length), name: v('ln') || 'New lead', phone: phone.padStart(10, '9'), source: v('ls'), project: v('lpr'), bmin: null, bmax: Number.isFinite(bud) ? bud : null, cfg: v('lc'), stage: 'new', owner: R().scope === 'all' ? 'bb' : R().user, follow: d(1, 11), note: '', created: new Date() });
    S.modal = null; S.leadView = 'list'; S.q = ''; S.stageF = ''; render(); toast('Lead saved');
  }
  if (e.target.id === 'empForm') { S.modal = null; render(); toast('Account created · temporary password shown once to the Admin'); }
});
app.addEventListener('change', (e) => {
  if (e.target.id === 'roleSel') { S.role = e.target.value; S.open = null; render(); toast('Now viewing as ' + R().label); }
  if (e.target.id === 'stageF') { S.stageF = e.target.value; render(); }
  if (e.target.id === 'stageSet') { const l = LEADS.find((x) => x.id === e.target.dataset.lead); l.stage = e.target.value; render(); toast('Stage changed to ' + stage(l.stage).label); }
});
app.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.open || S.modal)) { S.open = null; S.modal = null; render(); } });

render();
</script>

</html>
