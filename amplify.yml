# AWS Amplify Hosting build settings (see docs/DEPLOY-AWS.md).
# VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY come from Amplify → Hosting → Environment variables.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node -v
        - test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Amplify environment variables" && exit 1)
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
