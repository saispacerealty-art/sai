# AWS Amplify Hosting build settings (see docs/DEPLOY-AWS.md).
# Monorepo: only the website in frontend/ is built here. The backend/ folder is deployed to Supabase.
# In the Amplify console tick "My app is a monorepo" and enter frontend (sets AMPLIFY_MONOREPO_APP_ROOT).
# VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY come from Amplify → Hosting → Environment variables.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - node -v
            - test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Amplify environment variables" && exit 1)
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
